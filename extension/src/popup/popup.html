<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SessionWoy</title>
    <style>
      body { font: 13px/1.4 system-ui, sans-serif; width: 300px; margin: 0; padding: 12px; color: #111; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      .muted { color: #666; }
      .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
      button { font: inherit; padding: 4px 8px; border-radius: 6px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
      button.session { color: #fff; border: none; }
      button[aria-pressed='true'] { outline: 2px solid #111; }
      details { margin-top: 10px; }
      pre { font-size: 11px; white-space: pre-wrap; max-height: 200px; overflow: auto; background: #f5f5f5; padding: 6px; }
      .warn { color: #b45309; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>SessionWoy <span class="muted">POC</span></h1>
    <div>Current tab: <strong id="current">…</strong></div>
    <p class="warn" id="perm-warning" hidden>
      No host access for this site. Grant it, then reload the tab.
      <button id="grant">Grant access to this site</button>
    </p>
    <div class="muted">Assign this tab</div>
    <div class="row" id="assign"></div>
    <div class="muted">Open new tab in session</div>
    <div class="row" id="open"></div>
    <div class="muted">Reset (clear cookies)</div>
    <div class="row" id="reset"></div>
    <details>
      <summary>Diagnostics</summary>
      <pre id="diag"></pre>
    </details>
    <script src="popup.js" type="module"></script>
  </body>
</html>
